name: proba
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir ki && cd ki
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36'
          for q in verne nemo 80+nap dunai; do
            curl -sL -c c.txt -b c.txt -A "$UA" -o "tv-$q.html" "https://port.hu/kereso?q=$q&type=tvevent" || true
            curl -sL -c c.txt -b c.txt -A "$UA" -o "film-$q.html" "https://port.hu/kereso?q=$q&type=movie" || true
            sleep 1
          done
          rm -f c.txt; ls -la
          git init -q; git checkout -q -b proba-ki; git add .; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" proba-ki
