name: Forráspróba
on:
  push:
    branches: [forras-proba]
    paths: ['gyujto/**', '.github/workflows/proba.yml']
permissions:
  contents: write
jobs:
  proba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Próba
        run: |
          if [ -f gyujto/proba_futtat.py ]; then python3 gyujto/proba_futtat.py; else python3 gyujto/felderit.py; fi
      - name: Összegzés kiírása
        if: always()
        run: |
          head -c 60000 proba/osszegzes.txt | split -b 3000 - /tmp/r_ ; for f in /tmp/r_*; do echo "::notice::$(tr '\n' '¶' < $f)"; done || true
      - name: Mentés az ágra
        run: |
          git config user.name 'Verne-műsorfüzet'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short | head -20
          git add -A proba
          git diff --cached --quiet && exit 0
          git commit -qm "Forráspróba eredménye"
          if ! git push origin HEAD:refs/heads/forras-proba > /tmp/p 2>&1; then echo "::error::push: $(tr '\n' ' ' < /tmp/p | cut -c1-900)"; exit 1; fi
