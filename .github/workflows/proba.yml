name: proba
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir ki && cd ki
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36'
          while read n u; do
            curl -sL -m 40 -c c.txt -b c.txt -A "$UA" -H 'Accept-Language: en,de,fr,es,pt,pl;q=0.8' -o "$n.html" -w "$n %{http_code} %{size_download} %{url_effective}\n" "$u" >> lista.txt || echo "$n HIBA" >> lista.txt
          done <<'L'
          es-sensacine https://www.sensacine.com/peliculas/en-cartelera/cines/
          es-sensacine2 https://www.sensacine.com/peliculas/en-cartelera/cines/?page=2
          de-kinode https://www.kino.de/filme/aktuell/
          de-kinode2 https://www.kino.de/kinoprogramm/
          uk-odeon https://www.odeon.co.uk/films/
          uk-vue https://www.myvue.com/whats-on
          uk-cineworld https://www.cineworld.co.uk/films
          uk-empire https://www.empireonline.com/movies/in-cinemas/
          uk-picturehouses https://www.picturehouses.com/whats-on
          pt-cinecartaz https://cinecartaz.publico.pt/
          pt-cinecartaz2 https://cinecartaz.publico.pt/filmes-em-exibicao
          pl-filmweb https://www.filmweb.pl/showtimes
          pl-filmweb2 https://www.filmweb.pl/ranking/premiere
          ch-cineman https://www.cineman.ch/de/film/
          ch-cineman2 https://www.cineman.ch/fr/films/
          be-cinenews https://www.cinenews.be/fr/films/
          be-cinenews2 https://www.cinenews.be/fr/films/actuellement-en-salle/
          at-kinoat https://www.kino.at/
          at-filmat https://www.film.at/kinoprogramm
          us-fandango https://www.fandango.com/movies-in-theaters
          us-moviefone https://www.moviefone.com/movies/now-playing/
          us-rottentomatoes https://www.rottentomatoes.com/browse/movies_in_theaters/
          tmdb https://api.themoviedb.org/3/movie/now_playing?region=GB
          L
          sed -i 's/^ *//' lista.txt; cat lista.txt; rm -f c.txt
          git init -q; git checkout -q -b proba-ki; git add .; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" proba-ki
