name: proba
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir ki && cd ki
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36'
          D=$(date +%d-%m-%Y); D2=$(date +%Y%m%d); D3=$(date +%Y-%m-%d)
          cat > l.txt <<L
          fc https://www.radiofrance.fr/franceculture/grille-programmes
          fc2 https://www.radiofrance.fr/franceculture/grille-programmes?date=$D
          fi https://www.radiofrance.fr/franceinter/grille-programmes
          dlfk https://www.deutschlandfunkkultur.de/programm
          dlfk2 https://www.deutschlandfunkkultur.de/programm?drsearch:date=$D3
          oe1 https://oe1.orf.at/programm/$D2
          ardhsp https://hoerspiele.dra.de/
          ardaudio https://www.ardaudiothek.de/suche/jules%20verne/
          rai3 https://www.raiplaysound.it/palinsesto/radio3
          porthu-ev https://port.hu/kereso?q=verne&type=generalevent
          porthu-ev2 https://port.hu/kereso?q=jules+verne&type=generalevent
          nantes https://metropole.nantes.fr/que-faire-a-nantes/agenda?search=jules+verne
          unidivers https://unidivers.fr/?s=jules+verne
          openagenda https://openagenda.com/fr/search?search=jules%20verne
          L
          sed -i 's/^ *//' l.txt
          while read n u; do curl -sL -m 40 -c c.txt -b c.txt -A "$UA" -o "$n.html" -w "$n %{http_code} %{size_download} %{url_effective}\n" "$u" >> lista.txt || echo "$n HIBA" >> lista.txt; sleep 1; done < l.txt
          cat lista.txt; rm -f c.txt
          git init -q; git checkout -q -b proba-ki; git add .; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" proba-ki
